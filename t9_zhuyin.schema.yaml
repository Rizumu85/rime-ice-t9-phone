# Rime schema
# encoding: utf-8

schema:
  schema_id: t9_zhuyin
  name: 注音九键
  version: "1.0.0"
  author:
    - Rime Developers
    - Rizumu85
  description: |
    Predictive Zhuyin input grouped for a physical T9 keypad.
    The first version ranks toneless readings instead of reserving tone keys.

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, A ]
  - name: traditionalization
    states: [ 简, 繁 ]
  - name: emoji
    states: [ 字, 😄 ]
    reset: 1
  - name: full_shape
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier@emoji
    - simplifier@traditionalize
    - uniquifier

speller:
  alphabet: "9876543210'"
  initials: "9876543210"
  delimiter: "'"
  algebra:
    - xform/^m$/mu/
    - xform/iu/iou/
    - xform/ui/uei/
    - xform/ong/ung/
    - xform/^yi?/i/
    - xform/^wu?/u/
    - xform/iu/v/
    - xform/^([jqx])u/$1v/
    - xform/([iuv])n/$1en/
    - xform/^zhi?/Z/
    - xform/^chi?/C/
    - xform/^shi?/S/
    - xform/^([zcsr])i/$1/
    - xform/ai/A/
    - xform/ei/I/
    - xform/ao/O/
    - xform/ou/U/
    - xform/ang/K/
    - xform/eng/G/
    - xform/an/M/
    - xform/en/N/
    - xform/er/R/
    - xform/eh/E/
    - xform/([iv])e/$1E/
    - xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR|1111222233344455556660007777888899999|

translator:
  dictionary: rime_ice
  prism: t9_zhuyin
  enable_word_completion: true
  spelling_hints: 32
  always_show_comments: true
  comment_format:
    - xform/(^| )m(?= |$)/$1mu/
    - xform/iu(?= |$)/iou/
    - xform/ui(?= |$)/uei/
    - xform/ong(?= |$)/ung/
    - xform/(^| )yi?/$1i/
    - xform/(^| )wu?/$1u/
    - xform/iu/v/
    - xform/(^| )([jqx])u/$1$2v/
    - xform/([iuv])n/$1en/
    - xform/(^| )zhi?/$1Z/
    - xform/(^| )chi?/$1C/
    - xform/(^| )shi?/$1S/
    - xform/(^| )([zcsr])i(?= |$)/$1$2/
    - xform/ai(?= |$)/A/
    - xform/ei(?= |$)/I/
    - xform/ao(?= |$)/O/
    - xform/ou(?= |$)/U/
    - xform/ang(?= |$)/K/
    - xform/eng(?= |$)/G/
    - xform/an(?= |$)/M/
    - xform/en(?= |$)/N/
    - xform/er(?= |$)/R/
    - xform/eh(?= |$)/E/
    - xform/([iv])e(?= |$)/$1E/
    - 'xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ|'

emoji:
  option_name: emoji
  opencc_config: emoji.json
  inherit_comment: false

traditionalize:
  option_name: traditionalization
  opencc_config: s2t.json
  tips: none

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    - { when: composing, accept: numbersign, send: apostrophe }
    - { when: has_menu, accept: Up, send: Page_Up }
    - { when: has_menu, accept: Down, send: Page_Down }
    - { when: has_menu, accept: Left, send: Up }
    - { when: has_menu, accept: Right, send: Down }

menu:
  page_size: 24
